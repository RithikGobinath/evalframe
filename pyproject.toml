[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalframe"
version = "0.1.0"
description = "Reproducible cross-provider LLM evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2,<3",
  "anthropic>=1,<2",
  "mlflow>=3,<4",
  "absl-py>=2,<3",
  "langdetect>=1,<2",
  "nltk>=3,<4",
  "immutabledict>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
cloud = ["google-cloud-storage>=3,<4"]

[project.scripts]
evalframe = "evalframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instruction_following_eval = ["LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
